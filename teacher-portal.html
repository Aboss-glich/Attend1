<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"><script src="app-common.js" defer></script><script src="preferences.js" defer></script><script src="portal.js" defer></script><title>Attendly | Teacher portal</title></head>
<body><main class="portal-shell"><header class="portal-header"><div class="brand"><span class="brand-mark">A</span><span>attendly</span></div><button class="logout-button" id="portalLogout">Log out</button></header><section class="portal-hero"><p class="eyebrow">TEACHER WORKSPACE</p><h1 id="portalTitle">Teacher portal</h1><p>Take attendance and review records for your assigned class.</p></section><section class="portal-links"><a href="index.html"><strong>Take attendance</strong><span>Open your daily register</span></a><a href="reports.html"><strong>View reports</strong><span>Review attendance patterns</span></a></section><section class="portal-card"><h2>Create student login</h2><p>Give a student in your assigned class a secure account.</p><form id="studentAccountForm" class="portal-form"><label>Student<select id="accountStudent" required></select></label><label>Username<input id="accountUsername" required placeholder="e.g. aarav01"></label><label>Password<input id="accountPassword" type="password" minlength="8" required></label><button class="primary-button" type="submit">Create student account</button></form><p id="portalMessage" role="status"></p></section></main></body>
</html>
